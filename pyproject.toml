[project]
name = "poke-wrap"
version = "0.1.0"
description = "Async, typed, cache-aware Python wrapper for PokeAPI."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Sosa", email = "alejandrososa.freelancer@gmail.com" }
]
keywords = ["pokeapi", "pokemon", "async", "httpx", "pydantic"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "hishel[httpx]>=1.4.0",
    "httpx>=0.28.1",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Alike-Dev/poke-wrap"
Repository = "https://github.com/Alike-Dev/poke-wrap"
Issues = "https://github.com/Alike-Dev/poke-wrap/issues"
Changelog = "https://github.com/Alike-Dev/poke-wrap/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poke_wrap"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[dependency-groups]
dev = [
    "build>=1.6.1",
    "commitizen>=4.19.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "rich>=15.0.0",
    "ruff>=0.17.0",
    "twine>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["poke_wrap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/poke_wrap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hishel.*"]
ignore_missing_imports = true
