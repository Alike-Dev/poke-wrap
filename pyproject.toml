[project]
name = "poke-wrap-client"
version = "0.1.0"
description = "Async, typed, cache-aware Python wrapper for PokeAPI."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Alejandro Sosa", email = "alejandrososa.freelancer@gmail.com" }
]
keywords = ["pokeapi", "pokemon", "async", "httpx", "pydantic"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "hishel[httpx]>=1.4.0",
    "httpx>=0.28.1",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Alike-Dev/poke-wrap"
Repository = "https://github.com/Alike-Dev/poke-wrap"
Issues = "https://github.com/Alike-Dev/poke-wrap/issues"
Changelog = "https://github.com/Alike-Dev/poke-wrap/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poke_wrap"]

[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}"
example = "feat(client): add caching support"
schema = "<type>(<scope>): <subject>"
schema_pattern = "(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.*\\))?!?:.*"
bump_pattern = "^(feat|fix|perf|refactor)"
bump_map = {"feat" = "MINOR", "fix" = "PATCH", "perf" = "PATCH", "refactor" = "PATCH"}

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing"
choices = [
    { value = "feat", name = "feat: A new feature" },
    { value = "fix", name = "fix: A bug fix" },
    { value = "docs", name = "docs: Documentation only changes" },
    { value = "style", name = "style: Code style (formatting, whitespace)" },
    { value = "refactor", name = "refactor: Code change that neither fixes a bug nor adds a feature" },
    { value = "perf", name = "perf: Performance improvement" },
    { value = "test", name = "test: Adding or fixing tests" },
    { value = "build", name = "build: Build system or dependencies" },
    { value = "ci", name = "ci: CI configuration" },
    { value = "chore", name = "chore: Other changes (dependabot, config)" },
    { value = "revert", name = "revert: Revert a previous commit" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "What is the scope of this change? (press Enter to skip)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Write a short, imperative description of the change"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Provide a longer description (optional, press Enter to skip)"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking_change"
message = "Is this a BREAKING CHANGE?"

[[tool.commitizen.customize.questions]]
type = "input"
name = "footer"
message = "List any issues closed by this change (optional, press Enter to skip)"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "commitizen>=4.19.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "rich>=15.0.0",
    "ruff>=0.17.0",
    "twine>=7.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["poke_wrap"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/poke_wrap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hishel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["comparison-overlap"]
