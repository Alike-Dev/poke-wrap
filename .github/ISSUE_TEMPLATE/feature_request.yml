name: Feature request
description: Suggest a new feature or improvement for poke-wrap-client
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Before opening, please check the
        [existing issues](https://github.com/Alike-Dev/poke-wrap/issues)
        to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
      placeholder: "I often need to fetch all Pokémon of a given type..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like poke-wrap-client to address it?
      render: python
      placeholder: |
        # Something like:
        pokemon = await client.get_pokemon_by_type("electric")
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have thought about.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, related discussions.
    validations:
      required: false