name: Bug report
description: Report a bug or unexpected behaviour in poke-wrap-client
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as you can — the more information, the faster we can help.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "When I call `client.get_pokemon('x')`, I get..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal code snippet that triggers the issue.
      render: python
      placeholder: |
        import asyncio
        from poke_wrap import AsyncPokeAPIClient

        async def main() -> None:
            async with AsyncPokeAPIClient() as client:
                ...

        asyncio.run(main())
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include the full traceback if relevant.
      render: shell
    validations:
      required: true

  - type: input
    id: poke-wrap-version
    attributes:
      label: poke-wrap-client version
      description: "Run: python -c \"import poke_wrap; print(poke_wrap.__version__)\""
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: "Run: python --version"
      placeholder: "3.12.10"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant — screenshots, related issues, workarounds.
    validations:
      required: false